[package]
name = "koe"
version = "0.1.0"
description = "Kōe — on-device speech to text for macOS"
edition = "2021"

[lib]
name = "koe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
cpal = "0.15"
hound = "3.5"
whisper-rs = { version = "0.14", features = ["metal"] }
# native-tls = macOS Security framework, so company/proxy CAs in the Keychain are trusted.
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls", "json", "blocking", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
arboard = "3"
enigo = "0.2"
chrono = "0.4"
dirs = "5"

[profile.dev.package."*"]
opt-level = 2
